name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite \
            qt6-svg-dev qt6-multimedia-dev cmake ninja-build g++ libgl1-mesa-dev \
            libfuse2 desktop-file-utils libtorrent-rasterbar-dev pkg-config
      - name: Generate icon
        run: python3 packaging/linux/generate-icon.py
      - name: Build AppImage
        env:
          LINUXDEPLOY_OUTPUT_VERSION: ${{ inputs.tag }}
        run: |
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh
          test -f dist/OCRCatalog-${{ inputs.tag }}-x86_64.AppImage \
            || test -f dist/OCRCatalog-${{ inputs.tag }}-aarch64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          archives: "qtbase qtsvg qtmultimedia qttools"
      - name: NSIS
        run: choco install nsis -y
      - name: Build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./packaging/windows/build.ps1
          $setup = "dist/OCRCatalog-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "NSIS did not produce dist/OCRCatalog-setup.exe"
          }
          $named = "dist/OCRCatalog-$env:RELEASE_TAG-setup.exe"
          Move-Item -Force $setup $named
          Get-Item $named
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/OCRCatalog-*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          archives: "qtbase qtsvg qtmultimedia qttools"
      - name: Build DMG
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          chmod +x packaging/macos/build-dmg.sh
          ./packaging/macos/build-dmg.sh
          test -f dist/OCRCatalog-macos.dmg
          mv dist/OCRCatalog-macos.dmg "dist/OCRCatalog-${RELEASE_TAG}-macos.dmg"
          ls -l dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Confirm release files
        run: |
          find artifacts -type f | sort
          test "$(find artifacts -name '*.AppImage' | wc -l)" -ge 1
          test "$(find artifacts -name '*.exe' | wc -l)" -ge 1
          test "$(find artifacts -name '*.dmg' | wc -l)" -ge 1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: OCR Catalog ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.dmg
          body: |
            Desktop builds for OCR Catalog ${{ inputs.tag }}:

            - Linux AppImage
            - Windows installer (`.exe`)
            - macOS disk image (`.dmg`)
